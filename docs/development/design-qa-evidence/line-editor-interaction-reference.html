document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   <\u002Fdiv>\n            <button style=\"flex: 0 0 auto; font-size: 12.5px; font-weight: 600; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 7px 13px; cursor: pointer\" style-hover=\"{{ hoverSurface }}\">Change customer<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #EEF1F5\">\n            <sc-for list=\"{{ customerFacts }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px; padding: 13px 18px; background: #FFFFFF; min-width: 0\">\n                <span style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #8A929E\">{{ f.label }}<\u002Fspan>\n                <span style=\"font-size: 13.5px; font-weight: 600; color: #14181C; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ f.value }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 10px\">\n          <div style=\"display: flex; flex-direction: column; gap: 3px; padding: 16px 18px; border-bottom: 1px solid #EEF1F5\">\n            <h2 style=\"margin: 0; font-size: 15px; font-weight: 700\">Invoice details<\u002Fh2>\n            <p style=\"margin: 0; font-size: 12.5px; color: #5B6470; text-wrap: pretty\">Set the dates, reference, and the currency and tax that every line below inherits.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; padding: 16px 18px 18px\">\n            <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"font-size: 12.5px; font-weight: 600; color: #4A5361\">Issue date<\u002Fspan>\n              <input type=\"date\" value=\"{{ issueDate }}\" sc-camel-on-change=\"{{ onIssueDate }}\" style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 9px 11px\">\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"font-size: 12.5px; font-weight: 600; color: #4A5361\">Payment term (days)<\u002Fspan>\n              <input type=\"number\" value=\"{{ term }}\" sc-camel-on-change=\"{{ onTerm }}\" style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 9px 11px\">\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 600; color: #4A5361\">Due date<span style=\"font-size: 11px; font-weight: 400; color: #8A929E\">auto from term<\u002Fspan><\u002Fspan>\n              <input type=\"date\" value=\"{{ dueDate }}\" sc-camel-on-change=\"{{ onDueDate }}\" style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 9px 11px\">\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"font-size: 12.5px; font-weight: 600; color: #4A5361\">Customer reference / PO number<\u002Fspan>\n              <input type=\"text\" value=\"{{ poRef }}\" sc-camel-on-change=\"{{ onPoRef }}\" placeholder=\"PO1234\" style=\"font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 9px 11px\">\n              <span style=\"font-size: 11.5px; color: #8A929E\">Optional reference or purchase order number.<\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"font-size: 12.5px; font-weight: 600; color: #4A5361\">Currency<\u002Fspan>\n              <sc-raw-select value=\"{{ currency }}\" sc-camel-on-change=\"{{ onCurrency }}\" style=\"font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 9px 10px; cursor: pointer\">\n                <sc-for list=\"{{ currencyOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <span style=\"font-size: 11.5px; color: #8A929E\">Applies to every line and to the ledger.<\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n              <span style=\"font-size: 12.5px; font-weight: 600; color: #4A5361\">Tax default<\u002Fspan>\n              <sc-raw-select value=\"{{ taxDefault }}\" sc-camel-on-change=\"{{ onTaxDefault }}\" style=\"font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 9px 10px; cursor: pointer\">\n                <sc-for list=\"{{ taxOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <span style=\"font-size: 11.5px; color: #8A929E\">Applied to new lines; each line can override it.<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n    <aside style=\"position: sticky; top: 138px; align-self: stretch; display: flex; flex-direction: column\">\n      <div style=\"flex: 1; background: #14181C; border-radius: 10px; padding: 16px 17px 17px; display: flex; flex-direction: column; gap: 13px\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n          <span style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #8E949F\">Balance<\u002Fspan>\n          <span style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 4px; padding: 3px 8px; color: {{ statusFg }}; background: {{ statusBg }}\">{{ statusLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; gap: 9px\">\n          <span style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 15px; font-weight: 700; color: #8E949F\">{{ currency }}<\u002Fspan>\n          <span style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-variant-numeric: tabular-nums; font-size: 27px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em\">{{ outstandingValue }}<\u002Fspan>\n          <span style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 12px; color: #8E949F\">outstanding<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height: 5px; border-radius: 999px; background: #2A2F38; overflow: hidden\">\n          <div style=\"height: 100%; border-radius: 999px; background: #A3E635; width: {{ paidPercent }}\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-direction: column; gap: 9px; flex: 1; justify-content: center; border-top: 1px solid #2A2F38; padding-top: 13px\">\n          <sc-for list=\"{{ balanceRows }}\" as=\"b\" hint-placeholder-count=\"7\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-family: 'Atkinson Hyperlegible Mono', monospace; font-variant-numeric: tabular-nums; font-size: {{ b.size }}; border-top: {{ b.rule }} solid #2A2F38; padding-top: {{ b.padTop }}\">\n              <span style=\"color: {{ b.labelFg }}\">{{ b.label }}<\u002Fspan>\n              <span style=\"color: {{ b.fg }}; font-weight: 700\">{{ b.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <button style=\"font-size: 12.5px; font-weight: 600; color: #14181C; background: #A3E635; border: 0; border-radius: 6px; padding: 9px; cursor: pointer; margin-top: 2px\" style-hover=\"{{ hoverLime }}\">Record payment<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n    <\u002Fdiv>\n\n  <section style=\"background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 10px\">\n    <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 16px 18px; border-bottom: 1px solid #EEF1F5\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0\">\n        <h2 style=\"margin: 0; font-size: 15px; font-weight: 700\">Products and services<\u002Fh2>\n        <p style=\"margin: 0; font-size: 12.5px; color: #5B6470\">{{ lineSummary }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"overflow-x: auto\">\n    <div style=\"display: grid; grid-template-columns: 46px minmax(200px, 1fr) 104px 62px 96px 104px 88px 96px 132px 116px 42px; gap: 0; align-items: center; min-width: 1090px; background: #FAFBFC; border-bottom: 1px solid #DEE3E9\">\n      <sc-for list=\"{{ lineHeaders }}\" as=\"h\" hint-placeholder-count=\"11\">\n        <span style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6E7783; padding: 10px 8px; text-align: {{ h.align }}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ h.label }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ lines }}\" as=\"l\" hint-placeholder-count=\"1\">\n      <div style=\"display: grid; grid-template-columns: 46px minmax(200px, 1fr) 104px 62px 96px 104px 88px 96px 132px 116px 42px; gap: 0; align-items: start; min-width: 1090px; border-bottom: 1px solid #EEF1F5\" style-hover=\"{{ hoverRow }}\">\n        <span style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 700; color: #8A929E; padding: 14px 8px\">{{ l.index }}<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 1px; padding: 7px 6px 8px; min-width: 0; border-left: 1px solid #F1F4F7\">\n          <input type=\"text\" value=\"{{ l.name }}\" sc-camel-on-change=\"{{ l.onName }}\" placeholder=\"Product or service title\" style=\"width: 100%; box-sizing: border-box; font-size: 13.5px; font-weight: 600; color: #14181C; background: transparent; border: 0; border-radius: 4px; padding: 4px 6px\" style-focus=\"{{ focusCell }}\">\n          <input type=\"text\" value=\"{{ l.description }}\" sc-camel-on-change=\"{{ l.onDescription }}\" placeholder=\"Description shown under the title\" style=\"width: 100%; box-sizing: border-box; font-size: 12px; color: #5B6470; background: transparent; border: 0; border-radius: 4px; padding: 3px 6px\" style-focus=\"{{ focusCell }}\">\n        <\u002Fdiv>\n        <div style=\"padding: 7px 4px; border-left: 1px solid #F1F4F7\"><input type=\"number\" value=\"{{ l.price }}\" sc-camel-on-change=\"{{ l.onPrice }}\" style=\"width: 100%; box-sizing: border-box; font-family: 'Atkinson Hyperlegible Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13px; color: #14181C; background: transparent; border: 0; border-radius: 4px; padding: 7px 8px; text-align: right\" style-focus=\"{{ focusCell }}\"><\u002Fdiv>\n        <div style=\"padding: 7px 4px; border-left: 1px solid #F1F4F7\"><input type=\"number\" value=\"{{ l.qty }}\" sc-camel-on-change=\"{{ l.onQty }}\" style=\"width: 100%; box-sizing: border-box; font-family: 'Atkinson Hyperlegible Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13px; color: #14181C; background: transparent; border: 0; border-radius: 4px; padding: 7px 8px; text-align: right\" style-focus=\"{{ focusCell }}\"><\u002Fdiv>\n        <div style=\"padding: 7px 2px; border-left: 1px solid #F1F4F7\">\n          <sc-raw-select value=\"{{ l.unit }}\" sc-camel-on-change=\"{{ l.onUnit }}\" style=\"width: 100%; box-sizing: border-box; font-size: 12.5px; color: #14181C; background: transparent; border: 0; border-radius: 4px; padding: 7px 6px; cursor: pointer\" style-focus=\"{{ focusCell }}\">\n            <sc-for list=\"{{ unitOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"padding: 7px 2px; border-left: 1px solid #F1F4F7\">\n          <sc-raw-select value=\"{{ l.period }}\" sc-camel-on-change=\"{{ l.onPeriod }}\" style=\"width: 100%; box-sizing: border-box; font-size: 12.5px; color: #14181C; background: transparent; border: 0; border-radius: 4px; padding: 7px 6px; cursor: pointer\" style-focus=\"{{ focusCell }}\">\n            <sc-for list=\"{{ periodOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"padding: 7px 4px; border-left: 1px solid #F1F4F7\"><input type=\"number\" value=\"{{ l.periodQty }}\" sc-camel-on-change=\"{{ l.onPeriodQty }}\" style=\"width: 100%; box-sizing: border-box; font-family: 'Atkinson Hyperlegible Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13px; color: #14181C; background: transparent; border: 0; border-radius: 4px; padding: 7px 8px; text-align: right\" style-focus=\"{{ focusCell }}\"><\u002Fdiv>\n        <div style=\"padding: 7px 4px; border-left: 1px solid #F1F4F7\"><input type=\"number\" value=\"{{ l.discount }}\" sc-camel-on-change=\"{{ l.onDiscount }}\" style=\"width: 100%; box-sizing: border-box; font-family: 'Atkinson Hyperlegible Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13px; color: #14181C; background: transparent; border: 0; border-radius: 4px; padding: 7px 8px; text-align: right\" style-focus=\"{{ focusCell }}\"><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 1px; padding: 7px 2px; border-left: 1px solid #F1F4F7\">\n          <sc-raw-select value=\"{{ l.tax }}\" sc-camel-on-change=\"{{ l.onTax }}\" style=\"width: 100%; box-sizing: border-box; font-size: 12.5px; color: #14181C; background: transparent; border: 0; border-radius: 4px; padding: 7px 6px; cursor: pointer\" style-focus=\"{{ focusCell }}\">\n            <sc-for list=\"{{ taxOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <span style=\"font-size: 10.5px; color: #8A929E; padding: 0 7px\">{{ l.taxNote }}<\u002Fspan>\n        <\u002Fdiv>\n        <span title=\"{{ l.breakdown }}\" style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; color: #14181C; text-align: right; padding: 14px 10px; border-left: 1px solid #F1F4F7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{ l.total }}<\u002Fspan>\n        <div style=\"display: flex; justify-content: center; padding: 11px 4px; border-left: 1px solid #F1F4F7\">\n          <button sc-camel-on-click=\"{{ l.onRemove }}\" title=\"Remove line\" style=\"font-size: 12px; line-height: 1; color: #C4291B; background: #FFFFFF; border: 1px solid #EFD3CF; border-radius: 5px; padding: 6px 8px; cursor: pointer\" style-hover=\"{{ hoverDanger }}\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <button sc-camel-on-click=\"{{ onAddLine }}\" style=\"display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 13px; font-weight: 600; color: #14181C; background: #F style=\"margin: 0; font-size: 15px; font-weight: 700\">Payment reminders<\u002Fh2>\n              <p style=\"margin: 0; font-size: 12.5px; color: #5B6470; text-wrap: pretty\">Customize this Invoice schedule and review every automated reminder outcome.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 7px; flex: 0 0 auto\">\n              <button sc-camel-on-click=\"{{ onAddReminder }}\" style=\"display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 7px 13px; cursor: pointer\" style-hover=\"{{ hoverSurface }}\"><span style=\"font-size: 14px; line-height: 1\">+<\u002Fspan>Add reminder<\u002Fbutton>\n              <button style=\"font-size: 12.5px; font-weight: 600; color: #FFFFFF; background: #14181C; border: 1px solid #14181C; border-radius: 6px; padding: 7px 13px; cursor: pointer\" style-hover=\"{{ hoverInk }}\">Save reminder rules<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasReminders }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-for list=\"{{ reminders }}\" as=\"r\" hint-placeholder-count=\"1\">\n              <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 128px 168px 92px 40px; gap: 12px; align-items: end; padding: 13px 18px; border-bottom: 1px solid #EEF1F5\">\n                <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n                  <span style=\"font-size: 12px; font-weight: 600; color: #4A5361\">Trigger<\u002Fspan>\n                  <sc-raw-select value=\"{{ r.trigger }}\" sc-camel-on-change=\"{{ r.onTrigger }}\" style=\"font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 8px 10px; cursor: pointer\">\n                    <sc-for list=\"{{ r.triggerOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n                  <span style=\"font-size: 12px; font-weight: 600; color: #4A5361\">Offset (days)<\u002Fspan>\n                  <input type=\"number\" value=\"{{ r.offset }}\" sc-camel-on-change=\"{{ r.onOffset }}\" style=\"font-family: 'Atkinson Hyperlegible Mono', monospace; font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 8px 10px\">\n                <\u002Flabel>\n                <label style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n                  <span style=\"font-size: 12px; font-weight: 600; color: #4A5361\">Channel<\u002Fspan>\n                  <sc-raw-select value=\"{{ r.channel }}\" sc-camel-on-change=\"{{ r.onChannel }}\" style=\"font-size: 13px; color: #14181C; background: #FFFFFF; border: 1px solid #DEE3E9; border-radius: 6px; padding: 8px 10px; cursor: pointer\">\n                    <sc-for list=\"{{ r.channelOptions }}\" as=\"o\" hint-placeholder-count=\"2\">\n                      <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Flabel>\n                <button sc-camel-on-click=\"{{ r.onToggle }}\" style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 6px; padding: 9px 10px; cursor: pointer; color: {{ r.stateFg }}; background: {{ r.stateBg }}; border: 1px solid {{ r.stateBd }}\">{{ r.stateLabel }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ r.onRemove }}\" title=\"Remove reminder\" style=\"font-size: 12px; line-height: 1; color: #C4291B; background: #FFFFFF; border: 1px solid #EFD3CF; border-radius: 6px; padding: 9px; cursor: pointer\" style-hover=\"{{ hoverDanger }}\">✕<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noReminders }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin: 15px 18px 0; font-size: 12.5px; color: #5B6470; background: #FAFBFC; border: 1px dashed #DEE3E9; border-radius: 7px; padding: 14px 15px\">This Invoice has no reminder rules.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; flex-direction: column; gap: 9px; padding: 15px 18px 17px\">\n            <span style=\"font-size: 13px; font-weight: 700; color: #14181C\">Reminder history<\u002Fspan>\n            <div style=\"font-size: 12.5px; color: #5B6470; background: #FAFBFC; border: 1px dashed #DEE3E9; border-radius: 7px; padding: 14px 15px\">No reminder instances have been scheduled.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1672,&quot;height&quot;:1200},&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Build&quot;,&quot;Money&quot;,&quot;Share&quot;],&quot;default&quot;:&quot;Build&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;}}\">\nconst CURRENCIES = [\"EUR\", \"RON\", \"USD\", \"GBP\"];\nconst LANGUAGES = [\"English\", \"Română\", \"Deutsch\", \"Français\"];\nconst BANKS = [\"Greedy\", \"Transilvania RON\", \"Wise EUR\"];\nconst UNITS = [\"Host\", \"Hour\", \"Day\", \"Piece\", \"Licence\"];\nconst PERIODS = [\"Year\", \"Month\", \"Quarter\", \"One-off\"];\nconst TRIGGERS = [\"Before due date\", \"On due date\", \"After due date\", \"After last reminder\"];\nconst CHANNELS = [\"Email\", \"Email + secure link\", \"Secure link only\"];\n// Company-defined taxes; exactly one is the default applied to new lines.\nconst TAXES = [\n  { key: \"TVA 21%\", name: \"TVA\", rate: 21, default: true },\n  { key: \"TVA 11%\", name: \"TVA\", rate: 11 },\n  { key: \"TVA 0%\", name: \"TVA\", rate: 0 },\n  { key: \"Reverse charge\", name: \"Reverse charge\", rate: 0 },\n  { key: \"Exempt\", name: \"Exempt\", rate: 0 }\n];\nconst DEFAULT_TAX = TAXES.find(t => t.default);\nconst taxByKey = k => TAXES.find(t => t.key === k) || DEFAULT_TAX;\n\nconst fmt = n => Number(n || 0).toLocaleString(\"en-US\", { minimumFractionDigits: 2, maximumFractionDigits: 2 });\nconst addDays = (iso, d) => { const t = new Date(iso + \"T00:00:00Z\"); t.setUTCDate(t.getUTCDate() + Number(d || 0)); return t.toISOString().slice(0, 10); };\nconst daysBetween = (a, b) => Math.round((new Date(b + \"T00:00:00Z\") - new Date(a + \"T00:00:00Z\")) / 86400000);\n\nclass Component extends DCLogic {\n  state = {\n    tab: \"Build\",\n    dirty: false,\n    issueDate: \"2026-08-27\",\n    term: 30,\n    dueDate: \"2026-09-26\",\n    poRef: \"PO1234\",\n    currency: \"EUR\",\n    language: \"English\",\n    bank: \"Greedy\",\n    terms: \"Text T&C\",\n    notes: \"Text Invoice Notes\",\n    linkActive: true,\n    copied: false,\n    linkSuffix: \"xyjxxO5fOkhn__16vbTohUh5aax5vi8apGJZTTds7Q4\",\n    reminders: [],\n    taxDefault: DEFAULT_TAX.key,\n    lines: [\n      { id: 1, name: \"VMS Enterprise\", description: \"Description VMS Enterprise\", price: 1800, qty: 1, unit: \"Host\", period: \"Year\", periodQty: 1, discount: 10, tax: DEFAULT_TAX.key }\n    ],\n    nextId: 2\n  };\n\n  componentDidMount() {\n    if (this.props.startTab) this.setState({ tab: this.props.startTab });\n  }\n\n  touch(patch) { this.setState({ ...patch, dirty: true }); }\n\n  setLine(id, patch) {\n    this.touch({ lines: this.state.lines.map(l => (l.id === id ? { ...l, ...patch } : l)) });\n  }\n\n  moveLine(i, delta) {\n    const lines = [...this.state.lines];\n    const j = i + delta;\n    if (j < 0 || j >= lines.length) return;\n    const tmp = lines[i]; lines[i] = lines[j]; lines[j] = tmp;\n    this.touch({ lines });\n  }\n\n  lineMath(l) {\n    const gross = Number(l.price || 0) * Number(l.qty || 0) * Number(l.periodQty || 0);\n    const net = gross * (1 - Number(l.discount || 0) / 100);\n    const tax = net * taxByKey(l.tax).rate / 100;\n    return { gross, net, tax, total: net + tax };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const cur = s.currency;\n\n    const math = s.lines.map(l => this.lineMath(l));\n    const subtotal = math.reduce((a, m) => a + m.net, 0);\n    const tax = math.reduce((a, m) => a + m.tax, 0);\n    const total = subtotal + tax;\n    const paid = 1000;\n    const refunded = 0;\n    const netPaid = paid - refunded;\n    const outstanding = Math.max(0, total - netPaid);\n    const settled = outstanding <= 0.005;\n\n    const statusLabel = settled ? \"Paid\" : netPaid > 0 ? \"Partially paid\" : \"Issued\";\n    const statusBg = settled ? \"#A3E635\" : netPaid > 0 ? \"#FFB020\" : \"#FFFFFF\";\n    const statusFg = settled ? \"#1B2708\" : netPaid > 0 ? \"#2E1D00\" : \"#14181C\";\n\n    const hoverSurface = { background: \"#F4F6F8\", borderColor: \"#CFD6DE\" };\n    const hoverInk = { background: \"#000000\", borderColor: \"#000000\" };\n    const hoverGhost = { background: \"#F1F3F5\" };\n    const hoverDanger = { background: \"#FDF2F0\", borderColor: \"#E4B7B1\" };\n\n    const tabDefs = [\n      { key: \"Build\", label: \"Build document\", pill: s.lines.length + (s.lines.length === 1 ? \" line\" : \" lines\") },\n      { key: \"Money\", label: \"Payments & adjustments\", pill: settled ? \"settled\" : fmt(outstanding) + \" due\" },\n      { key: \"Share\", label: \"Sharing & reminders\", pill: s.linkActive ? \"link on\" : \"link off\" }\n    ];\n\n    const field = (l, i, label, key, opts) => {\n      const o = opts || {};\n      return {\n        label,\n        isSelect: !!o.options,\n        isInput: !o.options,\n        options: o.options,\n        type: o.type || \"text\",\n        font: o.mono === false ? \"inherit\" : \"'Atkinson Hyperlegible Mono', monospace\",\n        placeholder: o.placeholder || \"\",\n        value: o.type === \"number\" ? String(l[key]) : l[key],\n        onChange: e => this.setLine(l.id, { [key]: o.type === \"number\" ? Number(e.target.value) : e.target.value })\n      };\n    };\n\n    return {\n      hoverSurface, hoverInk, hoverGhost, hoverDanger,\n      hoverRow: { background: \"#FAFBFC\" },\n      hoverNav: { background: \"#191E25\", color: \"#FFFFFF\" },\n      hoverNavCard: { background: \"#20262E\", borderColor: \"#2E353F\" },\n      hoverNavIcon: { background: \"#1B2027\", color: \"#FFFFFF\" },\n      hoverLime: { background: \"#B7EF52\" },\n\n      dirty: s.dirty,\n      statusLabel, statusBg, statusFg,\n      currency: cur,\n      issueDate: s.issueDate,\n      dueDate: s.dueDate,\n      term: String(s.term),\n      poRef: s.poRef,\n      terms: s.terms,\n      notes: s.notes,\n\n      sendFg: s.dirty ? \"#5B6470\" : \"#14181C\",\n      sendBg: s.dirty ? \"#F4F6F8\" : \"#A3E635\",\n      sendBd: s.dirty ? \"#DEE3E9\" : \"#A3E635\",\n      sendHover: s.dirty ? { background: \"#EDF1F5\" } : { background: \"#B7EF52\", borderColor: \"#B7EF52\" },\n      sendTitle: s.dirty ? \"Save the invoice before sending it\" : \"Send this invoice to its resolved recipients\",\n\n      onSave: () => this.setState({ dirty: false }),\n      onCancel: () => this.setState({ dirty: false }),\n      onIssueDate: e => this.touch({ issueDate: e.target.value, dueDate: addDays(e.target.value, s.term) }),\n      onTerm: e => this.touch({ term: Number(e.target.value), dueDate: addDays(s.issueDate, e.target.value) }),\n      onDueDate: e => this.touch({ dueDate: e.target.value, term: daysBetween(s.issueDate, e.target.value) }),\n      onPoRef: e => this.touch({ poRef: e.target.value }),\n      onTerms: e => this.touch({ terms: e.target.value }),\n      onNotes: e => this.touch({ notes: e.target.value }),\n\n      tabs: tabDefs.map(t => {\n        const on = s.tab === t.key;\n        return {\n          label: t.label, pill: t.pill,\n          fg: on ? \"#14181C\" : \"#5B6470\",\n          line: on ? \"#14181C\" : \"transparent\",\n          pillFg: on ? \"#14181C\" : \"#6E7783\",\n          pillBg: on ? \"#EDF1F5\" : \"#F4F6F8\",\n          hover: on ? {} : { color: \"#14181C\" },\n          onClick: () => this.setState({ tab: t.key })\n        };\n      }),\n      showBuild: s.tab === \"Build\",\n      showOther: s.tab !== \"Build\",\n      focusCell: { background: \"#FFFFFF\", boxShadow: \"inset 0 0 0 1px #14181C\" },\n      unitOptions: UNITS,\n      currencyOptions: CURRENCIES,\n      taxDefault: s.taxDefault,\n      onCurrency: e => this.touch({ currency: e.target.value }),\n      onTaxDefault: e => this.touch({ taxDefault: e.target.value }),\n      taxOptions: TAXES.map(t => t.key),\n      periodOptions: PERIODS,\n      lineHeaders: [\n        { label: \"Line\", align: \"left\" },\n        { label: \"Product or service\", align: \"left\" },\n        { label: \"Item price\", align: \"right\" },\n        { label: \"Qty\", align: \"right\" },\n        { label: \"Unit\", align: \"left\" },\n        { label: \"Period\", align: \"left\" },\n        { label: \"Period qty\", align: \"right\" },\n        { label: \"Discount %\", align: \"right\" },\n        { label: \"Tax\", align: \"left\" },\n        { label: \"Line total\", align: \"right\" },\n        { label: \"\", align: \"center\" }\n      ],\n      showMoney: s.tab === \"Money\",\n      showShare: s.tab === \"Share\",\n      onGoShare: () => this.setState({ tab: \"Share\" }),\n\n      customerFacts: [\n        { label: \"Customer\", value: \"The Company\" },\n        { label: \"Billing contact\", value: \"finance@thecompany.example\" },\n        { label: \"VAT / Tax id\", value: \"RO 41 992 118\" },\n        { label: \"Billing address\", value: \"Str. Mihai Viteazu 14, Cluj\" }\n      ],\n\n      defaultSelects: [\n        { label: \"Document language\", value: s.language, options: LANGUAGES, hint: \"Language of the rendered document.\", onChange: e => this.touch({ language: e.target.value }) },\n        { label: \"Bank account\", value: s.bank, options: BANKS, hint: \"Bank account: \" + s.bank, onChange: e => this.touch({ bank: e.target.value }) }\n      ],\n\n      lineSummary: \"All amounts in \" + cur + \" · \" + s.lines.length + (s.lines.length === 1 ? \" line\" : \" lines\") + \", every value editable on this document\",\n      onAddLine: () => this.touch({\n        lines: [...s.lines, { id: s.nextId, name: \"\", description: \"\", price: 0, qty: 1, unit: \"Host\", period: \"Year\", periodQty: 1, discount: 0, tax: s.taxDefault }],\n        nextId: s.nextId + 1\n      }),\n\n      lines: s.lines.map((l, i) => {\n        const m = math[i];\n        const first = i === 0;\n        const last = i === s.lines.length - 1;\n        return {\n          title: \"Line \" + (i + 1),\n          index: String(i + 1),\n          name: l.name,\n          nameHint: l.name ? \"Catalog snapshot, editable on this document.\" : \"Pick from the catalog or type a one-off name.\",\n          onName: e => this.setLine(l.id, { name: e.target.value }),\n          description: l.description,\n          onDescription: e => this.setLine(l.id, { description: e.target.value }),\n          price: l.price,\n          onPrice: e => this.setLine(l.id, { price: e.target.value }),\n          qty: l.qty,\n          onQty: e => this.setLine(l.id, { qty: e.target.value }),\n          unit: l.unit,\n          onUnit: e => this.setLine(l.id, { unit: e.target.value }),\n          period: l.period,\n          onPeriod: e => this.setLine(l.id, { period: e.target.value }),\n          periodQty: l.periodQty,\n          onPeriodQty: e => this.setLine(l.id, { periodQty: e.target.value }),\n          discount: l.discount,\n          onDiscount: e => this.setLine(l.id, { discount: e.target.value }),\n          tax: l.tax,\n          taxNote: l.tax === s.taxDefault ? \"document default\" : \"overridden\",\n          onTax: e => this.setLine(l.id, { tax: e.target.value }),\n          upFg: first ? \"#C3CBD3\" : \"#4A5361\",\n          upCursor: first ? \"not-allowed\" : \"pointer\",\n          upHover: first ? {} : hoverSurface,\n          downFg: last ? \"#C3CBD3\" : \"#4A5361\",\n          downCursor: last ? \"not-allowed\" : \"pointer\",\n          downHover: last ? {} : hoverSurface,\n          onUp: () => this.moveLine(i, -1),\n          onDown: () => this.moveLine(i, 1),\n          onRemove: () => this.touch({ lines: s.lines.filter(x => x.id !== l.id) }),\n          fields: [\n            field(l, i, \"Item price\", \"price\", { type: \"number\" }),\n            field(l, i, \"Quantity\", \"qty\", { type: \"number\" }),\n            field(l, i, \"Unit\", \"unit\", { options: UNITS }),\n            field(l, i, \"Period\", \"period\", { options: PERIODS }),\n            field(l, i, \"Period quantity\", \"periodQty\", { type: \"number\" }),\n            field(l, i, \"Discount %\", \"discount\", { type: \"number\" }),\n            field(l, i, \"Tax\", \"tax\", { options: TAXES.map(t => t.key) })\n          ],\n          breakdown: \"net \" + fmt(m.net) + \" · tax \" + fmt(m.tax),\n          total: fmt(m.total)\n        };\n      }),\n\n      totals: [\n        { label: \"Subtotal\", value: fmt(subtotal), size: \"14px\", labelFg: \"#5B6470\", rule: \"0px\", padTop: \"0px\" },\n        { label: \"Tax\", value: fmt(tax), size: \"14px\", labelFg: \"#5B6470\", rule: \"0px\", padTop: \"0px\" },\n        { label: \"Total \" + cur, value: fmt(total), size: \"20px\", labelFg: \"#14181C\", rule: \"1px\", padTop: \"9px\" }\n      ],\n\n      moneyActions: [\n        { label: \"Record payment\", fg: \"#FFFFFF\", bg: \"#14181C\", bd: \"#14181C\", hover: hoverInk },\n        { label: \"Record refund\", fg: \"#14181C\", bg: \"#FFFFFF\", bd: \"#DEE3E9\", hover: hoverSurface },\n        { label: \"Record adjustment\", fg: \"#14181C\", bg: \"#FFFFFF\", bd: \"#DEE3E9\", hover: hoverSurface }\n      ],\n      moneyStats: [\n        { label: \"Invoice total\", value: fmt(total) + \" \" + cur, fg: \"#14181C\" },\n        { label: \"Net paid\", value: fmt(netPaid) + \" \" + cur, fg: \"#4D7C0F\" },\n        { label: \"Outstanding\", value: fmt(outstanding) + \" \" + cur, fg: settled ? \"#4D7C0F\" : \"#B03028\" },\n        { label: \"Refundable cash\", value: fmt(netPaid) + \" \" + cur, fg: \"#14181C\" }\n      ],\n      ledgerHeaders: [\n        { label: \"Type\", justify: \"start\" },\n        { label: \"Date\", justify: \"start\" },\n        { label: \"Amount\", justify: \"end\" },\n        { label: \"Details\", justify: \"start\" },\n        { label: \"Actions\", justify: \"end\" }\n      ],\n      ledger: [\n        {\n          type: \"Payment\", date: \"2026-08-27\", amount: fmt(paid) + \" \" + cur,\n          amountFg: \"#14181C\", method: \"Card\",\n          details: \"Text Reference · Text Notes\",\n          typeFg: \"#1B2708\", typeBg: \"#EAF7CE\", typeBd: \"#CBE79A\"\n        }\n      ],\n\n      publicLink: \"https://app.invumo.com/i/\" + s.linkSuffix,\n      linkFg: s.linkActive ? \"#14181C\" : \"#98A0AB\",\n      linkState: s.linkActive ? \"Active\" : \"Revoked\",\n      linkStateFg: s.linkActive ? \"#1B2708\" : \"#5B6470\",\n      linkStateBg: s.linkActive ? \"#EAF7CE\" : \"#F1F3F5\",\n      linkStateBd: s.linkActive ? \"#CBE79A\" : \"#E1E5EA\",\n      linkExpiry: s.linkActive ? \"Sep 28, 2026, 2:48 PM\" : \"—\",\n      copyLabel: s.copied ? \"Copied\" : \"Copy link\",\n      onCopyLink: () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1400); },\n      onRegenerate: () => this.setState({ linkActive: true, linkSuffix: Math.random().toString(36).slice(2) + \"__\" + Math.random().toString(36).slice(2) }),\n      onToggleLink: () => this.setState({ linkActive: !s.linkActive }),\n      revokeLabel: s.linkActive ? \"Revoke link\" : \"Reactivate link\",\n      revokeFg: s.linkActive ? \"#C4291B\" : \"#14181C\",\n      revokeBd: s.linkActive ? \"#EFD3CF\" : \"#DEE3E9\",\n      revokeHover: s.linkActive ? hoverDanger : hoverSurface,\n\n      deliveryFacts: [\n        { label: \"Resolved recipients\", value: \"0 recipients\" },\n        { label: \"Attachment\", value: \"Immutable PDF\" },\n        { label: \"Mode\", value: \"Secure link only\" }\n      ],\n\n      hasReminders: s.reminders.length > 0,\n      noReminders: s.reminders.length === 0,\n      onAddReminder: () => this.setState({\n        reminders: [...s.reminders, { id: Date.now(), trigger: \"Before due date\", offset: 3, channel: \"Email\", on: true }]\n      }),\n      reminders: s.reminders.map(r => ({\n        trigger: r.trigger, triggerOptions: TRIGGERS,\n        offset: String(r.offset), channel: r.channel, channelOptions: CHANNELS,\n        stateLabel: r.on ? \"On\" : \"Off\",\n        stateFg: r.on ? \"#FFFFFF\" : \"#5B6470\",\n        stateBg: r.on ? \"#14181C\" : \"#FFFFFF\",\n        stateBd: r.on ? \"#14181C\" : \"#DEE3E9\",\n        onTrigger: e => this.setState({ reminders: s.reminders.map(x => x.id === r.id ? { ...x, trigger: e.target.value } : x) }),\n        onOffset: e => this.setState({ reminders: s.reminders.map(x => x.id === r.id ? { ...x, offset: Number(e.target.value) } : x) }),\n        onChannel: e => this.setState({ reminders: s.reminders.map(x => x.id === r.id ? { ...x, channel: e.target.value } : x) }),\n        onToggle: () => this.setState({ reminders: s.reminders.map(x => x.id === r.id ? { ...x, on: !x.on } : x) }),\n        onRemove: () => this.setState({ reminders: s.reminders.filter(x => x.id !== r.id) })\n      })),\n\n      outstandingValue: fmt(outstanding),\n      paidPercent: (total > 0 ? Math.min(100, (netPaid / total) * 100) : 0) + \"%\",\n      balanceRows: (() => {\n        const gross = math.reduce((a, m) => a + m.gross, 0);\n        const discount = gross - subtotal;\n        const rates = {};\n        s.lines.forEach((l, i) => {\n          const key = taxByKey(l.tax).key;\n          rates[key] = (rates[key] || 0) + math[i].tax;\n        });\n        // only rates that actually contribute tax decide collapse vs. split\n        const rateKeys = Object.keys(rates).filter(k => rates[k] > 0.004);\n        const dim = \"#8E949F\";\n        const rows = [\n          { label: \"Gross\", value: fmt(gross), fg: \"#FFFFFF\", labelFg: dim, size: \"12px\", rule: \"0px\", padTop: \"0px\" }\n        ];\n        if (discount > 0.004) rows.push({ label: \"Discount\", value: \"−\" + fmt(discount), fg: \"#FFB020\", labelFg: dim, size: \"12px\", rule: \"0px\", padTop: \"0px\" });\n        rows.push({ label: \"Taxable base\", value: fmt(subtotal), fg: \"#FFFFFF\", labelFg: dim, size: \"12px\", rule: \"0px\", padTop: \"0px\" });\n        if (rateKeys.length <= 1) {\n          const onLine = [...new Set(s.lines.map(l => taxByKey(l.tax).key))];\n          const label = rateKeys[0]\n            || (s.lines.length === 0 ? taxByKey(s.taxDefault).key : onLine.length === 1 ? onLine[0] : null);\n          rows.push({ label: label ? \"Tax · \" + label : \"Tax\", value: fmt(tax), fg: \"#FFFFFF\", labelFg: dim, size: \"12px\", rule: \"0px\", padTop: \"0px\" });\n        } else {\n          rateKeys.forEach(k => rows.push({ label: \"Tax · \" + k, value: fmt(rates[k]), fg: \"#FFFFFF\", labelFg: dim, size: \"12px\", rule: \"0px\", padTop: \"0px\" }));\n        }\n        rows.push({ label: \"Total\", value: fmt(total), fg: \"#FFFFFF\", labelFg: \"#FFFFFF\", size: \"14px\", rule: \"1px\", padTop: \"9px\" });\n        rows.push({ label: \"Paid\", value: fmt(netPaid), fg: \"#A3E635\", labelFg: dim, size: \"12px\", rule: \"0px\", padTop: \"0px\" });\n        rows.push({ label: \"Outstanding\", value: fmt(total - netPaid), fg: \"#FFFFFF\", labelFg: dim, size: \"12px\", rule: \"0px\", padTop: \"0px\" });\n        return rows;\n      })(),\n\n      sideFacts: [\n        { label: \"Customer\", value: \"The Company\", fg: \"#14181C\", font: \"inherit\" },\n        { label: \"Issue date\", value: s.issueDate, fg: \"#14181C\", font: \"'Atkinson Hyperlegible Mono', monospace\" },\n        { label: \"Due date\", value: s.dueDate, fg: \"#14181C\", font: \"'Atkinson Hyperlegible Mono', monospace\" },\n        { label: \"Payment term\", value: s.term + \" days\", fg: \"#14181C\", font: \"inherit\" },\n        { label: \"Reference\", value: s.poRef || \"—\", fg: \"#14181C\", font: \"'Atkinson Hyperlegible Mono', monospace\" },\n        { label: \"Language\", value: s.language, fg: \"#14181C\", font: \"inherit\" },\n        { label: \"Tax default\", value: s.taxDefault, options: TAXES.map(t => t.key), hint: \"Applied to new lines. Existing lines keep their own selection.\", onChange: e => this.touch({ taxDefault: e.target.value }) },\n        { label: \"Bank account\", value: s.bank, fg: \"#14181C\", font: \"inherit\" }\n      ],\n\n      sideStatus: [\n        { label: \"Public link\", value: s.linkActive ? \"Active\" : \"Revoked\", dot: s.linkActive ? \"#A3E635\" : \"#C3CBD3\" },\n        { label: \"Email delivery\", value: \"Not queued\", dot: \"#C3CBD3\" },\n        { label: \"Reminders\", value: s.reminders.length === 0 ? \"No rules\" : s.reminders.length + \" rules\", dot: s.reminders.length === 0 ? \"#C3CBD3\" : \"#FFB020\" }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
