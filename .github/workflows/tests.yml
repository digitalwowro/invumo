name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: invumo_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CANONICAL_VISUAL_SNAPSHOTS: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: invumo_test
      DB_USERNAME: invumo_runtime
      DB_PASSWORD: invumo_runtime_test_password
      DB_SCHEMA_HOST: 127.0.0.1
      DB_SCHEMA_PORT: 5432
      DB_SCHEMA_DATABASE: invumo_test
      DB_SCHEMA_USERNAME: invumo_schema
      DB_SCHEMA_PASSWORD: invumo_schema_test_password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, fileinfo, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          PGPASSWORD=postgres psql --host=127.0.0.1 --username=postgres --dbname=invumo_test --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE invumo_schema LOGIN PASSWORD 'invumo_schema_test_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE invumo_runtime LOGIN PASSWORD 'invumo_runtime_test_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER DATABASE invumo_test OWNER TO invumo_schema;
          REVOKE ALL ON DATABASE invumo_test FROM PUBLIC;
          GRANT CONNECT ON DATABASE invumo_test TO invumo_schema, invumo_runtime;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO invumo_schema;
          GRANT USAGE ON SCHEMA public TO invumo_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE invumo_schema IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO invumo_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE invumo_schema IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO invumo_runtime;
          SQL
          php artisan migrate --database=pgsql_schema --force

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run CI Checks
        run: composer ci:check

      - name: Upload browser comparison details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-comparison-details
          path: tests/Browser/Screenshots/ImageDiffView
          if-no-files-found: ignore
          retention-days: 7
